name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest      # setup-python no longer ships 3.9 there; see linux-py39
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and fake-Moodle tests
        run: python -m unittest discover -s tests -v
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes skills tests

  linux-py39:
    # The oldest supported Python, on Linux, from the official image.
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v4
      - name: Unit and fake-Moodle tests
        run: python -m unittest discover -s tests -v
